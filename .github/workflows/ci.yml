name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Shell lint and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest runners.
      # --severity=error keeps pre-existing style/info/warning lint from
      # failing the build. Tighten to --severity=warning (or drop the flag)
      # once the scripts are clean.
      - name: shellcheck bash scripts
        run: |
          shellcheck --severity=error install.sh
          for f in bin/*; do
            [ -f "$f" ] || continue
            shellcheck --severity=error "$f"
          done

      - name: bash -n syntax check
        run: |
          bash -n install.sh
          for f in bin/*; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh -n syntax check
        run: |
          for f in .zshrc .common_env .macos_env .linux_env; do
            zsh -n "$f"
          done
