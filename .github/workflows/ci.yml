name: CI

on:
  push:
  pull_request:

# This job only lints; it never needs write access or the checkout token.
permissions:
  contents: read

jobs:
  lint:
    name: Shell lint and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: shellcheck bash scripts
        run: |
          shellcheck --severity=warning install.sh
          for f in bin/*; do
            [ -f "$f" ] || continue
            shellcheck --severity=warning "$f"
          done

      - name: bash -n syntax check
        run: |
          bash -n install.sh
          for f in bin/*; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: zsh -n syntax check
        run: |
          for f in .zshrc .common_env .macos_env .linux_env; do
            zsh -n "$f"
          done
