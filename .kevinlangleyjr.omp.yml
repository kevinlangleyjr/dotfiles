# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
blocks:
  - alignment: left
    segments:
      # OS logo
      - background: "#334155"
        foreground: "#e2e8f0"
        leading_diamond: ╭─
        style: diamond
        template: " {{.Icon}} "
        type: os
      - background: "#334155"
        foreground: "#e2e8f0"
        powerline_symbol: 
        properties:
          ssh_only: true
        style: powerline
        template: "{{ if .SSHSession }}  {{ .HostName }} {{ end }}"
        type: session
      - background: "#1e293b"
        foreground: "#5eead4"
        powerline_symbol: 
        properties:
          folder_icon: 
          folder_separator_icon: " / "
          home_icon: 
          max_depth: 2
          style: agnoster_short
        style: powerline
        template: " {{ .Path}} "
        type: path
      - background: "#38bdf8"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}#fb7185{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#ff4500{{ end }}"
          - "{{ if gt .Ahead 0 }}#B388FF{{ end }}"
          - "{{ if gt .Behind 0 }}#B388FF{{ end }}"
        foreground: "#193549"
        leading_diamond: 
        powerline_symbol: 
        properties:
          branch_max_length: 25
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
        style: powerline
        template: " {{ .UpstreamIcon }} {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
        trailing_diamond: 
        type: git
      - background: "#0f766e"
        foreground: "#ecfeff"
        powerline_symbol: 
        properties:
          display_mode: files
          fetch_version: true
          home_enabled: true
        style: powerline
        template: "   cmake {{ .Full }} "
        type: cmake
      - background: "#334155"
        foreground: "#5eead4"
        powerline_symbol: 
        properties:
          display_mode: files
          fetch_virtual_env: true
          home_enabled: true
        style: powerline
        template: "  {{ .Full }} "
        type: python
      - background: "#1e293b"
        foreground: "#5eead4"
        powerline_symbol: 
        properties:
          display_mode: files
          home_enabled: true
        style: powerline
        template: "  {{ .Full }}"
        type: java
    type: prompt
  - alignment: right
    segments:
      - foreground: "#cbd5e1"
        properties:
          always_enabled: true
          style: austin
        style: plain
        template: "  {{ .FormattedMs }} "
        type: executiontime
      - background: "#0e7490"
        background_templates:
          - '{{if eq "Charging" .State.String}}#0e7490{{end}}'
          - '{{if eq "Discharging" .State.String}}#b45309{{end}}'
        foreground: "#ecfeff"
        powerline_symbol: 
        properties:
          charged_icon: " "
          charging_icon: " "
          discharging_icon: " "
          not_charging_icon: 
        style: powerline
        template: ' {{ if .Error }}%{{ else }}{{ if not (and (ge .Percentage 100) (or (eq .State.String "Full") (eq .State.String "Charging") (eq .State.String "Not Charging"))) }}{{ .Icon }}{{ .Percentage }}%{{ end }}{{ end }} '
        type: battery
      - background: "#334155"
        foreground: "#94a3b8"
        style: diamond
        template: "  CPU: {{ round .PhysicalPercentUsed .Precision}}% | "
        type: sysinfo
      - background: "#334155"
        foreground: "#94a3b8"
        properties:
          precision: 0
        style: diamond
        template: >-
          RAM: {{ (div ((sub .PhysicalTotalMemory .PhysicalFreeMemory)|float64)
          1000000000.0) }}/{{ (div .PhysicalTotalMemory 1000000000.0) }}GB {{ " " }}
        type: sysinfo
      - background: "#1e293b"
        foreground: "#5eead4"
        invert_powerline: false
        powerline_symbol: 
        properties:
          time_format: "3:04 PM"
        style: powerline
        template: "  {{ .CurrentDate | date .Format }} "
        type: time
    type: prompt
  - alignment: left
    newline: true
    segments:
      - foreground: "#5eead4"
        style: plain
        template: ╰─
        type: text
      - foreground: "#5eead4"
        foreground_templates:
          - "{{ if gt .Code 0 }}#ef5350{{ end }}"
        properties:
          always_enabled: true
        style: plain
        template: ❯$
        type: exit
    type: prompt
console_title_template: "{{ .Shell }} in {{ .Folder }}"
final_space: true
version: 2
